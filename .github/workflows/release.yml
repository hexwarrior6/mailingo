name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: '发布版本标签 (例如 v0.1.0)'
        required: false
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-15
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 选择 Xcode 版本
        run: |
          sudo xcode-select -s /Applications/Xcode_16.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          swift --version

      - name: 准备构建工具 (XcodeGen)
        run: make bootstrap

      - name: 执行单元测试
        run: make test

      - name: 生成 Xcode 项目文件
        run: make gen

      - name: 编译 Release 产物 (Ad-hoc 签名)
        run: |
          # 注意：Xcode 16 要求 -derivedDataPath 必须为绝对路径，否则会触发 DVTAssertions 崩溃
          xcodebuild -project Mailingo.xcodeproj \
            -scheme Mailingo \
            -destination "platform=macOS" \
            -configuration Release \
            -derivedDataPath "${{ github.workspace }}/.build/DerivedData" \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            build

      - name: 打包 DMG 与 ZIP
        run: |
          bash Scripts/package-dmg.sh "${{ github.workspace }}/.build/DerivedData/Build/Products/Release/Mailingo.app" "${{ github.workspace }}/.build/dist"

      - name: 获取 Tag 名称与校验和
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          
          # 计算 SHA256 存入文件
          cd "${{ github.workspace }}/.build/dist"
          shasum -a 256 Mailingo.dmg Mailingo.zip > checksums.txt
          cat checksums.txt
          echo "checksums<<EOF" >> "$GITHUB_OUTPUT"
          cat checksums.txt >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: 发布至 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Mailingo ${{ steps.meta.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ### 📦 安装包下载
            
            - **[Mailingo.dmg](https://github.com/${{ github.repository }}/releases/download/${{ steps.meta.outputs.tag }}/Mailingo.dmg)**：拖拽即可安装至 `/Applications`。
            - **[Mailingo.zip](https://github.com/${{ github.repository }}/releases/download/${{ steps.meta.outputs.tag }}/Mailingo.zip)**：免挂载直接解压版。
            
            ### 🛡️ 首次运行说明（Gatekeeper 放行）
            因未接入付费 Apple 证书，首次打开如果系统提示*“无法打开”*或*“已损坏”*，请在终端执行一次放行命令：
            ```bash
            xattr -cr /Applications/Mailingo.app
            ```
            然后在 Apple Mail 的「设置」→「扩展」中勾选 **Mailingo** 即可开启使用。
            
            ### 🔐 SHA-256 校验和
            ```text
            ${{ steps.meta.outputs.checksums }}
            ```
          files: |
            .build/dist/Mailingo.dmg
            .build/dist/Mailingo.zip
            .build/dist/checksums.txt
