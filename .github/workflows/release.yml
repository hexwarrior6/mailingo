name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: '已存在的发布版本标签 (例如 v0.1.2)'
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-15
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}

      - name: 校验版本并提取 Changelog
        env:
          RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
        run: python3 Scripts/release-notes.py "$RELEASE_TAG" .build/release-notes.md --repo "$GITHUB_REPOSITORY"

      - name: 选择 Xcode 版本
        run: |
          sudo xcode-select -s /Applications/Xcode_16.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          swift --version

      - name: 准备构建工具 (XcodeGen)
        run: make bootstrap

      - name: 执行单元测试
        run: make test

      - name: 生成 Xcode 项目文件
        run: make gen

      - name: 编译 Release 产物 (Ad-hoc 签名)
        run: |
          # 注意：Xcode 16 要求 -derivedDataPath 必须为绝对路径，否则会触发 DVTAssertions 崩溃
          xcodebuild -project Mailingo.xcodeproj \
            -scheme Mailingo \
            -destination "platform=macOS" \
            -configuration Release \
            -derivedDataPath "${{ github.workspace }}/.build/DerivedData" \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            build

      - name: 校验应用与扩展的实际版本
        env:
          RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
        run: |
          python3 Scripts/release-notes.py "$RELEASE_TAG" .build/release-notes.md \
            --app .build/DerivedData/Build/Products/Release/Mailingo.app

      - name: 打包 DMG 与 ZIP
        run: |
          bash Scripts/package-dmg.sh "${{ github.workspace }}/.build/DerivedData/Build/Products/Release/Mailingo.app" "${{ github.workspace }}/.build/dist"

      - name: 生成发布说明与校验和
        id: meta
        env:
          RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
        run: |
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          (cd .build/dist && shasum -a 256 Mailingo.dmg Mailingo.zip > checksums.txt)
          python3 Scripts/release-notes.py "$RELEASE_TAG" .build/release-notes.md \
            --repo "$GITHUB_REPOSITORY" --checksums .build/dist/checksums.txt

      - name: 发布至 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Mailingo ${{ steps.meta.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: false
          body_path: .build/release-notes.md
          files: |
            .build/dist/Mailingo.dmg
            .build/dist/Mailingo.zip
            .build/dist/checksums.txt
