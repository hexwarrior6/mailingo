name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: '发布版本标签 (例如 v0.1.0)'
        required: false
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-15
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 选择 Xcode 版本
        run: |
          sudo xcode-select -s /Applications/Xcode_16.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          swift --version

      - name: 准备构建工具 (XcodeGen)
        run: make bootstrap

      - name: 执行单元测试
        run: make test

      - name: 生成 Xcode 项目文件
        run: make gen

      - name: 编译 Release 产物 (Ad-hoc 签名)
        run: |
          # 注意：Xcode 16 要求 -derivedDataPath 必须为绝对路径，否则会触发 DVTAssertions 崩溃
          xcodebuild -project Mailingo.xcodeproj \
            -scheme Mailingo \
            -destination "platform=macOS" \
            -configuration Release \
            -derivedDataPath "${{ github.workspace }}/.build/DerivedData" \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            build

      - name: 打包 DMG 与 ZIP
        run: |
          bash Scripts/package-dmg.sh "${{ github.workspace }}/.build/DerivedData/Build/Products/Release/Mailingo.app" "${{ github.workspace }}/.build/dist"

      - name: 获取 Tag 名称与校验和
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          
          # 计算 SHA256 存入文件
          cd "${{ github.workspace }}/.build/dist"
          shasum -a 256 Mailingo.dmg Mailingo.zip > checksums.txt
          cat checksums.txt
          echo "checksums<<EOF" >> "$GITHUB_OUTPUT"
          cat checksums.txt >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: 发布至 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Mailingo ${{ steps.meta.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## Installation

            ### Method 1: DMG Installer (Recommended)
            1. Download [`Mailingo.dmg`](https://github.com/${{ github.repository }}/releases/download/${{ steps.meta.outputs.tag }}/Mailingo.dmg) and drag `Mailingo.app` into `/Applications`.
            2. Remove the macOS Gatekeeper quarantine attribute (required for ad-hoc signed open-source releases):
               ```bash
               xattr -cr /Applications/Mailingo.app
               ```
            3. Relaunch Apple Mail, then enable **Mailingo** in **Settings (`⌘,`) → Extensions**.

            ### Method 2: Terminal One-liner
            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | bash
            ```

            ---

            ## 安装与启用说明

            1. 下载 [`Mailingo.dmg`](https://github.com/${{ github.repository }}/releases/download/${{ steps.meta.outputs.tag }}/Mailingo.dmg) 并将 `Mailingo.app` 拖移至 `/Applications` 目录；
            2. 在终端执行以下命令移除 Gatekeeper 隔离属性（开源自签分发所需）：
               ```bash
               xattr -cr /Applications/Mailingo.app
               ```
            3. 完全退出并重新启动 Apple Mail，前往 **设置 (`⌘,`) → 扩展** 勾选启用 **Mailingo**。

            ---

            ## Verification

            SHA-256 Checksums:
            ```text
            ${{ steps.meta.outputs.checksums }}
            ```
          files: |
            .build/dist/Mailingo.dmg
            .build/dist/Mailingo.zip
            .build/dist/checksums.txt
